services:
  postgres:
    image: postgres:17-alpine
    container_name: parrot-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: parrot
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dev_password_change_me}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d parrot"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
